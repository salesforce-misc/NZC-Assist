docs: skills/nzc-carbon-footprint-calc/SKILL.md
---
id: stationary-sources-have-account
group: data-integrity
description: No stationary asset source is missing its owning Account
severity: warning
check:
  type: soql
  query: SELECT COUNT() FROM StnryAssetEnvrSrc WHERE AccountId = null
  expect:
    operator: '='
    value: 0
remediation: Load accounts (step 10) before sources (step 12) — see JOURNEY_MAP.md Part 2
docs: skills/nzc-data-model/SKILL.md
---
id: scope3-procurement-sources-have-supplier
group: data-integrity
description: No Scope 3 procurement emission source is missing its Supplier link
severity: warning
check:
  type: soql
  query: SELECT COUNT() FROM Scope3EmssnSrc WHERE RecordType.DeveloperName = 'Procurement' AND SupplierId = null
  expect:
    operator: '='
    value: 0
remediation: Load suppliers (step 10) before Scope 3 procurement sources (step 12) — see JOURNEY_MAP.md Part 2
docs: skills/nzc-scope3-procurement/SKILL.md
---
id: energy-use-has-source
group: data-integrity
description: No stationary asset energy use record is missing its parent source
severity: error
check:
  type: soql
  query: SELECT COUNT() FROM StnryAssetEnrgyUse WHERE StnryAssetEnvrSrcId = null
  expect:
    operator: '='
    value: 0
remediation: Periodic energy use (step 13) must always thread off an existing source (step 12)
docs: skills/nzc-stationary-buildings/SKILL.md
