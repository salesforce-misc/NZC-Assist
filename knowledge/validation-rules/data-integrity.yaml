# Data integrity rules — catch orphaned or miswired records after sources,
# energy/activity use, and footprints have been loaded. Lookup field API
# names must be confirmed via describe_sobject before finalizing/trusting
# these queries against a specific org (names below are the design-time
# model — see CLAUDE.md § "Always describe_sobject").
---
id: annual-inventory-exists
group: data-integrity
description: At least one Annual Emissions Inventory exists for the current fiscal year
severity: error
check:
  type: soql
  query: SELECT COUNT() FROM AnnualEmssnInventory
  expect:
    operator: '>'
    value: 0
remediation: Run /nzc:build-annual-inventory before loading any source or footprint data
docs: skills/nzc-annual-inventory/SKILL.md
---
id: footprints-linked-to-inventory
group: data-integrity
description: No stationary carbon footprint is missing its Annual Emissions Inventory link
severity: error
check:
  type: soql
  query: SELECT COUNT() FROM StnryAssetCrbnFtprnt WHERE AnnualEmssnInventoryId = null
  expect:
    operator: '='
    value: 0
remediation: Every footprint must be created with a non-null AnnualEmssnInventoryId — see knowledge/data-model.md
docs: skills/nzc-carbon-footprint-calc/SKILL.md
---
id: vehicle-footprints-linked-to-inventory
group: data-integrity
description: No vehicle carbon footprint is missing its Annual Emissions Inventory link
severity: error
check:
  type: soql
  query: SELECT COUNT() FROM VehicleAssetCrbnFtprnt WHERE AnnualEmssnInventoryId = null
  expect:
    operator: '='
    value: 0
remediation: Every footprint must be created with a non-null AnnualEmssnInventoryId — see knowledge/data-model.md
docs: skills/nzc-carbon-footprint-calc/SKILL.md
---
id: scope3-footprints-linked-to-inventory
group: data-integrity
description: No Scope 3 carbon footprint is missing its Annual Emissions Inventory link
severity: error
check:
  type: soql
  query: SELECT COUNT() FROM Scope3CrbnFtprnt WHERE AnnualEmssnInventoryId = null
  expect:
